# Xcode project definition. Generate Chroma.xcodeproj with: xcodegen generate
name: Chroma
options:
  bundleIdPrefix: dev.nearby
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: 4F2YLTHL8T
    CODE_SIGN_STYLE: Automatic
    ENABLE_HARDENED_RUNTIME: YES
    MACOSX_DEPLOYMENT_TARGET: "26.0"
targets:
  Chroma:
    type: application
    platform: macOS
    sources:
      - path: Sources/Chroma
      - path: Resources/AppIcon.icon
        buildPhase: resources
      - path: Resources/Data
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_NAME: Chroma
        PRODUCT_BUNDLE_IDENTIFIER: dev.nearby.Chroma
        INFOPLIST_FILE: Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: Resources/Chroma.entitlements
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_IDENTITY: "Apple Development"
        ENABLE_APP_SANDBOX: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        COMBINE_HIDPI_IMAGES: YES
  ChromaTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/ChromaTests
    dependencies:
      - target: Chroma
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.nearby.ChromaTests
        GENERATE_INFOPLIST_FILE: YES
        BUNDLE_LOADER: "$(TEST_HOST)"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Chroma.app/Contents/MacOS/Chroma"
schemes:
  Chroma:
    build:
      targets:
        Chroma: all
    test:
      targets:
        - ChromaTests
